[package]
name = "axonotes-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
aws-config = "1.8.12"
aws-sdk-s3 = "1.119.0"
axum = "0.8.8"
blake3 = "1.8.2"
bytes = "1.11.0"
chrono = "0.4.42"
dashmap = "6.1.0"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
form_urlencoded = "1.2.2"
futures = "0.3.31"
hex = "0.4.3"
jsonwebtoken = { version = "10.2.0", features = ["aws_lc_rs"] }
notify = "8.2.0"
reqwest = { version = "0.13.1", features = ["json"] }
rhai = "1.23.6"
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.9.10"
tower-http = { version = "0.6.8", features = ["cors", "trace", "fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.19.0", features = ["v4"] }

[dev-dependencies]
criterion = { version = "0.8.1", features = ["async_tokio", "html_reports"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde_json = "1.0.148"
uuid = { version = "1.19.0", features = ["v4"] }

[[bench]]
name = "api_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = false
