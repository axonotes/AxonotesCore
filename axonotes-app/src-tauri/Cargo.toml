[package]
name = "axonotes-app"
version = "0.1.0"
# TODO: Update this ->
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "axonotes_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-decorum = "1.1.1"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2.3.1"
tauri-plugin-store = "2.4.0"

# Async Runtime
tokio = { version = "1.47.1", features = ["full"] }
futures = "0.3.31"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"
postcard = { version = "1.1.3", features = ["alloc"] }

# Database
rusqlite = { version = "0.38.0", features = ["bundled-sqlcipher", "bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
spacetimedb-sdk = "1.11.1"

# Auth & HTTP
reqwest = { version = "0.12.23", features = ["json"] }
tiny_http = "0.12.0"
jsonwebtoken = "9"
url = "2.5.7"
urlencoding = "2.1.3"

# Cryptography
argon2 = "0.5"
blake3 = "1.8"
chacha20poly1305 = "0.10.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
sha2 = "0.10.9"

# Encoding
base64 = "0.22.1"
hex = "0.4.3"

# Random
rand = { version = "0.9.2", features = ["os_rng"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }  # Must be 0.6.4 for x25519-dalek and ed25519-dalek

# Utilities
chrono = "0.4.42"
once_cell = "1.21.3"
paste = "1.0.15"
uuid = { version = "1.19.0", features = ["v4"] }
xpatch = "0.3.1"

# Performance
dashmap = "6.1.0"
moka = { version = "0.12.12", features = ["future"] }
rayon = "1.11.0"
