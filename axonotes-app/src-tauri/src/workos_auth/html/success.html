<!doctype html>
<html lang="en" class="{{dark_class}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication Successful</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div
      class="bg-background flex min-h-screen items-center justify-center p-6"
    >
      <div class="w-full max-w-sm space-y-8">
        <!-- Header -->
        <div class="space-y-4 text-center">
          <div
            class="bg-muted mx-auto flex h-12 w-12 items-center justify-center rounded-full"
          >
            <i class="text-muted-foreground h-5 w-5" data-lucide="check"></i>
          </div>
          <div class="space-y-2">
            <h1 class="text-xl font-semibold tracking-tight">
              Authentication Successful
            </h1>
            <p class="text-muted-foreground text-sm">
              You can close this window and return to the app.
            </p>
          </div>
        </div>

        <!-- Button -->
        <button
          class="bg-primary text-primary-foreground hover:bg-primary/90 focus-visible:ring-ring h-10 w-full rounded-md font-medium transition-colors focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:outline-none"
          onclick="window.close()"
        >
          Close Window
        </button>
      </div>
    </div>

    <script>
      lucide.createIcons();

      // Auto-close after 5 seconds
      setTimeout(() => {
        window.close();
      }, 5000);
    </script>
  </body>
</html>
