<!doctype html>
<html lang="en" class="{{dark_class}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication Failed</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div
      class="bg-background flex min-h-screen items-center justify-center p-6"
    >
      <div class="w-full max-w-sm space-y-8">
        <!-- Header -->
        <div class="space-y-4 text-center">
          <div
            class="bg-muted mx-auto flex h-12 w-12 items-center justify-center rounded-full"
          >
            <i
              class="text-muted-foreground h-5 w-5"
              data-lucide="alert-triangle"
            ></i>
          </div>
          <div class="space-y-2">
            <h1 class="text-xl font-semibold tracking-tight">
              Authentication Failed
            </h1>
            <p class="text-muted-foreground text-sm">
              We encountered an issue during authentication.
            </p>
          </div>
        </div>

        <!-- Error message -->
        <div
          class="border-destructive/30 bg-destructive/5 flex items-start gap-3 rounded-lg border p-4"
        >
          <i
            class="text-destructive mt-0.5 h-5 w-5 shrink-0"
            data-lucide="alert-circle"
          ></i>
          <p class="text-destructive text-sm">{{error}}</p>
        </div>

        <!-- Button -->
        <div class="space-y-4">
          <button
            class="bg-primary text-primary-foreground hover:bg-primary/90 focus-visible:ring-ring h-10 w-full rounded-md font-medium transition-colors focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:outline-none"
            onclick="window.close()"
          >
            Close Window
          </button>
          <p class="text-muted-foreground text-center text-xs">
            Please try again or contact support if the issue persists.
          </p>
        </div>
      </div>
    </div>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
